  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- safe body and feet -->
  <rect x="18" y="20" width="92" height="80" rx="14" fill="#fff"/>
  <rect x="28" y="98" width="16" height="10" rx="3" fill="#fff"/>
  <rect x="84" y="98" width="16" height="10" rx="3" fill="#fff"/>
  <!-- hinges -->
