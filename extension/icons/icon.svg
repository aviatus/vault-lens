  <rect x="24" y="72" width="7" height="14" rx="2.5" fill="#c2410c"/>
  <!-- combination dial with handle -->
  <circle cx="68" cy="60" r="23" fill="none" stroke="#c2410c" stroke-width="8"/>
  <g stroke="#c2410c" stroke-width="6" stroke-linecap="round">
    <line x1="68" y1="60" x2="68" y2="44"/>
    <line x1="68" y1="60" x2="81.9" y2="68"/>
    <line x1="68" y1="60" x2="54.1" y2="68"/>
  </g>
  <circle cx="68" cy="60" r="6" fill="#c2410c"/>
