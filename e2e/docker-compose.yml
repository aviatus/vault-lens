# Two throwaway dev-mode Vaults for E2E tests (in-memory, root token "root", local-only ports).
name: vault-reader-e2e

x-vault: &vault
  image: hashicorp/vault:1.18
  cap_add: [IPC_LOCK]
  environment:
    VAULT_DEV_ROOT_TOKEN_ID: root
    VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

services:
  vault-a:
    <<: *vault
    ports: ["127.0.0.1:18200:8200"]
  vault-b:
    <<: *vault
    ports: ["127.0.0.1:18201:8200"]
